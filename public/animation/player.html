<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K8s Journey · 动画</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#fafafa">
<meta name="description" content="K8s Journey 动画：用几分钟的动画讲清一节 Kubernetes 课的要点。">
<meta property="og:title" content="K8s Journey · 动画速览">
<meta property="og:image" content="/animation/journey/poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#171717;--body:#4d4d4d;--mute:#8f8f8f;--hair:#ebebeb;--accent:#326CE5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#fafafa;color:var(--ink);font-family:Geist,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#fafafa;cursor:pointer}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:10;transition:opacity .6s;padding:0 24px;
    background:radial-gradient(900px 520px at 30% 30%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(800px 500px at 75% 70%,rgba(121,40,202,.08),transparent 70%),#fafafa}
  #start::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
  #start>*{position:relative}
  #start .eyebrow{font-family:"Geist Mono",Menlo,monospace;font-size:13px;letter-spacing:.2em;color:var(--accent)}
  #start h1{font-size:clamp(34px,5vw,64px);font-weight:600;letter-spacing:-.035em;text-align:center;line-height:1.1}
  #start .brand{display:flex;align-items:center;gap:14px}
  #start .logo svg{width:40px;height:40px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.12))}
  #start p{color:var(--body);font-size:15px;text-align:center}
  #home{position:fixed;top:18px;left:22px;z-index:11;display:none;align-items:center;gap:8px;color:var(--body);font:500 13px Geist,"PingFang SC",sans-serif;text-decoration:none;padding:6px 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--hair);transition:color .15s,box-shadow .15s}
  #home:hover{color:var(--ink);box-shadow:0 0 0 1px #d4d4d4}
  .pill{appearance:none;border:0;cursor:pointer;background:#171717;color:#fff;font:500 16px Geist,"PingFang SC",sans-serif;padding:14px 28px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,background .15s}
  .pill:hover{transform:translateY(-1px);background:#383838}
  .pill.ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
  .pill.ghost:hover{background:#f5f5f5}
  /* 嵌入到课程页的小尺寸画框里时收紧开始页与控制栏 */
  @media (max-width:720px),(max-height:460px){#start{gap:14px}#start h1{font-size:clamp(22px,6vw,40px)}#start p{display:none}.pill{padding:10px 18px;font-size:14px}#start .logo svg{width:28px;height:28px}}
  @media (max-width:520px){#goRec{display:none}#listPos,#auto{display:none}#bar{padding:10px 12px}#chapters{display:none}.btn{height:28px;font-size:12px;padding:0 7px}#exp,#back,#fwd{display:none}}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:18px 24px 16px;background:linear-gradient(rgba(250,250,250,0),rgba(250,250,250,.94) 45%);display:flex;flex-direction:column;gap:10px;opacity:0;transition:opacity .3s;z-index:5}
  #wrap:hover~#bar,#bar:hover,#bar.show{opacity:1}
  #track{position:relative;height:6px;border-radius:3px;background:rgba(0,0,0,.08);cursor:pointer}
  #fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#007cf0,var(--accent),#7928ca)}
  .tick{position:absolute;top:-4px;width:2px;height:14px;background:rgba(0,0,0,.2);border-radius:1px}
  #chapters{display:flex;gap:6px;flex-wrap:wrap}
  .ch{font:500 12px "Geist Mono",Menlo,monospace;color:var(--body);background:#fff;border:1px solid var(--hair);border-radius:6px;padding:4px 8px;cursor:pointer}
  .ch:hover{border-color:#d4d4d4}
  .ch.on{color:#fff;border-color:var(--accent);background:var(--accent)}
  #row{display:flex;align-items:center;gap:10px}
  #row .logo svg{width:22px;height:22px;display:block}
  .btn{appearance:none;border:1px solid var(--hair);background:#fff;color:var(--ink);border-radius:6px;height:32px;min-width:36px;padding:0 10px;font:500 13px Geist,"PingFang SC",sans-serif;cursor:pointer}
  .btn:hover{background:#f5f5f5}
  #time{font:500 13px "Geist Mono",Menlo,monospace;color:var(--body);margin-left:4px}
  .sp{flex:1}
  #flash{position:fixed;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(0,0,0,.12),0 0 0 1px var(--hair);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transform:scale(.8);z-index:4}
  #flash.go{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
  #rec{position:fixed;top:16px;right:18px;font:600 12px "Geist Mono",monospace;color:#fff;background:#e5383b;border-radius:999px;padding:5px 12px;display:none;z-index:6}
  .btn:disabled{opacity:.35;cursor:default;background:#fff}
  #listPos{font:500 12px "Geist Mono",Menlo,monospace;color:var(--mute)}
  /* 连播：一部结束后的"接下来"卡片 */
  #upnext{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;background:rgba(250,250,250,.72);backdrop-filter:blur(6px)}
  #upnext .card{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--hair),0 16px 48px rgba(0,0,0,.10);padding:28px 32px;max-width:min(560px,90vw);display:flex;flex-direction:column;gap:12px;text-align:center}
  #upnext .eb{font:500 12px "Geist Mono",Menlo,monospace;letter-spacing:.16em;color:var(--accent)}
  #upnext .t{font-size:clamp(20px,3.2vw,30px);font-weight:600;letter-spacing:-.02em;color:var(--ink)}
  #upnext .c{font-size:14px;color:var(--body)}
  #upnext .acts{display:flex;gap:10px;justify-content:center;margin-top:6px}
  @media (max-height:460px){#upnext .card{padding:16px 20px;gap:6px}#upnext .c{display:none}}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:var(--body);font-size:15px;z-index:20;background:#fafafa}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>

<a id="home" href="/">← K8s Journey 课程</a>
<div id="start">
  <div class="brand"><span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#171717"/><path d="M16 6.5l8.2 4v9L16 25.5l-8.2-6v-9z" fill="none" stroke="#326ce5" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="#fff"/></svg></span><span class="eyebrow" id="eyebrow">K8S JOURNEY · 动画版</span></div>
  <h1 id="h1">&nbsp;</h1>
  <p id="sub">&nbsp;</p>
  <div style="display:flex;gap:12px">
    <button class="pill" id="go">▶&nbsp; 开始播放</button>
    <button class="pill ghost" id="goRec" title="从头完整播放一遍，同时录制为视频文件">● 播放并导出视频</button>
  </div>
</div>

<div id="bar">
  <div id="chapters"></div>
  <div id="track"><div id="fill"></div></div>
  <div id="row">
    <span class="logo" title="K8s Journey"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#171717"/><path d="M16 6.5l8.2 4v9L16 25.5l-8.2-6v-9z" fill="none" stroke="#326ce5" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.6" fill="#fff"/></svg></span>
    <button class="btn" id="prev" aria-label="上一部">⏮</button>
    <button class="btn" id="pp">❚❚</button>
    <button class="btn" id="next" aria-label="下一部">⏭</button>
    <button class="btn" id="back">↺ 5s</button>
    <button class="btn" id="fwd">5s ↻</button>
    <span id="time">0:00 / 0:00</span>
    <span class="sp"></span>
    <span id="listPos"></span>
    <button class="btn" id="auto" title="播完自动接着播下一部">⟳ 连播</button>
    <button class="btn" id="mute">🔊 声音</button>
    <button class="btn" id="voBtn" title="开关中文旁白（V）">🎙 旁白</button>
    <button class="btn" id="exp">● 导出视频</button>
    <button class="btn" id="fs">⛶ 全屏</button>
  </div>
</div>
<div id="upnext" role="dialog" aria-label="接下来播放">
  <div class="card">
    <span class="eb" id="nextEyebrow">接下来</span>
    <span class="t" id="nextTitle"></span>
    <span class="c"><span id="nextCount">5</span> 秒后自动播放</span>
    <div class="acts"><button class="pill" id="nextNow">▶&nbsp; 立即播放</button><button class="pill ghost" id="nextCancel">取消</button></div>
  </div>
</div>
<div id="rec">● REC 录制中</div>
<div id="flash"><svg viewBox="0 0 24 24" width="40" height="40"></svg></div>
<div id="err">这段动画暂时无法加载。</div>

<!-- 引擎：画面是时间 t 的纯函数 + Web Audio 实时合成配乐与音效；场景定义在 /animation/<id>/scenes.js -->
<script src="/animation/engine.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search).get('id')||'journey';
  const id=/^[a-z0-9-]+$/.test(q)?q:'journey';
  const s=document.createElement('script');s.src=`/animation/${id}/scenes.js`;
  s.onload=()=>boot(id).catch(e=>{console.error(e);document.getElementById('err').style.display='flex'});
  s.onerror=()=>{document.getElementById('err').style.display='flex';document.body.setAttribute('data-scan','load error '+id)};
  document.head.appendChild(s);
})();
</script>
</body>
</html>
